<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <style>
    body,
    html {
      margin: 0;
      overflow: hidden;
    }
  </style>
  <body>
    <div id="app">
      <button
        id="runButton"
        style="
          position: absolute;
          top: 20px;
          right: 20px;
          z-index: 100;
          padding: 12px 24px;
          font-family: monospace;
          font-weight: bold;
          background: #10b981;
          color: white;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        "
      >
        ▶ RUN GRAPH
      </button>
      <canvas id="compilerCanvas" width="800" height="600"></canvas>
    </div>
  </body>
  <script
    type="text/javascript"
    src="https://cdn.jsdelivr.net/npm/toastify-js"
  ></script>
  <script type="module" src="./src/main.js"></script>
</html>
